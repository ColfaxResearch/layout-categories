[project]
name = "layout-categories-visualization"
version = "0.1.0"
description = "Manim visualizations for the layout-categories project"
requires-python = ">=3.12,<3.14"
dependencies = [
    "manim>=0.20,<0.21",
    "tract",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = true

[tool.uv.sources]
tract = { path = "../tract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layout_categories_viz"]
